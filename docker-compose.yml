services:
  streamlit:
    build: .
    container_name: streamlit_app
    restart: unless-stopped
    expose:
      - "8501"
    volumes:
      - ./app:/app          # bind mount -> live reload du code sans rebuild
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      PYTHONFAULTHANDLER: 1
    depends_on:
      mysql:
        condition: service_healthy
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.fileWatcherType=poll

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Pas de "ports:" ici : le conteneur streamlit atteint mysql via le reseau
    # interne Docker Compose sans qu'il soit besoin d'exposer 3306 sur l'hote
    # (et donc potentiellement sur internet, l'hote ayant une IP publique
    # pour Caddy/Let's Encrypt). Pour du debug local ponctuel, ouvre un tunnel
    # avec `docker compose exec mysql mysql -u appuser -p` plutot que de
    # rouvrir ce port.
    volumes:
      - mysql_data:/var/lib/mysql                     # persistance des donnees
      - ./DB:/docker-entrypoint-initdb.d:ro  # charge ton dump au 1er demarrage
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 2s
      timeout: 5s
      retries: 5
      
  caddy:
    image: caddy:2
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"       # requis par Let's Encrypt pour valider le domaine
      - "443:443"     # trafic HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data       # stocke les certificats -> ne pas perdre ce volume
      - caddy_config:/config
    depends_on:
      - streamlit
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
